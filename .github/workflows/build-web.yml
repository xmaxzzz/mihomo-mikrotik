name: build mihomo-mikrotik + web

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      naive_version:
        description: 'Тег naiveproxy (пусто = latest)'
        required: false
        default: ''
      upx:
        description: 'Сжимать бинари UPX (нужно для внутренней памяти 128 МБ)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub репозиторий (можно переопределить переменной репо DOCKERHUB_REPO).
  # Секреты репозитория: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (PAT с правами Read & Write)
  IMAGE: docker.io/${{ vars.DOCKERHUB_REPO || 'xmaxzzz/mihomo-mikrotik' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$U" ] || [ -z "$T" ]; then
            echo "::error::Нет секретов DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Unit tests (web-panel)
        run: cd web-panel && go vet ./... && go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build & push (arm/v7, arm64, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          # RouterOS не понимает attestation-манифесты — отключаем
          provenance: false
          sbom: false
          build-args: |
            NAIVE_VERSION=${{ github.event.inputs.naive_version }}
            WITH_UPX=${{ github.event.inputs.upx || '1' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify armv7 image (binaries start, size)
        run: |
          docker pull -q --platform linux/arm/v7 "$IMAGE:$SHORT_SHA"
          docker run --rm --platform linux/arm/v7 --entrypoint sh "$IMAGE:$SHORT_SHA" -c \
            'set -e; mihomo -v; mihomo-web version; if [ -x /usr/bin/naive ]; then naive --version; else echo "naive: absent"; fi; ls -la /usr/bin/mihomo /usr/bin/mihomo-web /usr/bin/naive 2>/dev/null; du -sxh / 2>/dev/null | tail -1'
          SIZE=$(docker save --platform linux/arm/v7 "$IMAGE:$SHORT_SHA" | wc -c)
          echo "armv7 image size: $((SIZE/1024/1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -gt $((60*1024*1024)) ]; then
            echo "::warning::armv7 образ больше 60 МБ — во внутреннюю NAND L009 может не влезть"
          fi

      - name: Export armv7 tar (установка файлом)
        run: |
          docker save --platform linux/arm/v7 "$IMAGE:$SHORT_SHA" -o mihomo-mikrotik-armv7.tar
          ls -la mihomo-mikrotik-armv7.tar

      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-mikrotik-armv7
          path: mihomo-mikrotik-armv7.tar
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Docker Hub"
            echo "- \`$IMAGE:latest\`"
            echo "- \`$IMAGE:$SHORT_SHA\`"
            echo
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$SHORT_SHA" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
